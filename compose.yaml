# Devzair — stack Docker Compose (Phases 6A + 8A).
#
# Architecture cible (voir docs/06-ARCHITECTURE-CODE.md §16.1) :
# - `caddy`    : seul service exposé publiquement (port hôte 3001). Route
#                /api/** vers Symfony et tout le reste vers Nuxt/Nitro.
# - `web`      : Nuxt en mode dev (HMR), accessible uniquement par le réseau
#                interne. Ne publie plus de port hôte.
# - `api`      : Symfony 7.4 (serveur intégré PHP), accessible uniquement par
#                le réseau interne.
# - `postgres` : PostgreSQL 17-alpine (Phase 8A, voir ADR-009). Version
#                verrouillée, accessible uniquement depuis le réseau interne
#                Compose — jamais publié sur l'hôte.

services:
  caddy:
    build:
      context: ./infra/caddy
    ports:
      - "3001:80"
    depends_on:
      - web
      - api
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    working_dir: /app
    expose:
      - "3000"
    volumes:
      # Code monté pour le HMR.
      - ./apps/web:/app
      # node_modules garde le contenu installé dans l'image (npm ci au build).
      - web_node_modules:/app/node_modules
      # Cache Nuxt persistant pour éviter les recompilations à froid.
      - web_nuxt_cache:/app/.nuxt
    environment:
      NODE_ENV: development
      # Le SITE_URL utilisé pour les URL absolues (sitemap, canonical) reste
      # celui du point d'entrée public — Caddy.
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3001}
      # Défaut sécurisé : le site en dev n'est pas indexable. Passer à `true`
      # uniquement pour tester le rendu SEO en mode production.
      NUXT_PUBLIC_SITE_INDEXABLE: ${NUXT_PUBLIC_SITE_INDEXABLE:-false}
      # Base URL relative : le navigateur appelle /api/... et Caddy route
      # vers le conteneur api.
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-/api}
      # Base URL PRIVÉE utilisée uniquement par Nitro en SSR pour appeler
      # Symfony sans passer par Caddy. Symfony expose ses routes sans le
      # préfixe `/api` (Caddy strip côté public), donc on pointe la racine
      # du conteneur api. Voir ADR-011.
      NUXT_EDITORIAL_API_BASE_URL: ${NUXT_EDITORIAL_API_BASE_URL:-http://api:8000}
      # Clé publique Cloudflare Turnstile — vide en dev (widget dev-noop).
      NUXT_PUBLIC_TURNSTILE_SITE_KEY: ${NUXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      # Interrupteur front Turnstile. Doit rester `false` tant que la prod
      # n'active pas explicitement (aligné avec TURNSTILE_ENABLED côté API).
      NUXT_PUBLIC_TURNSTILE_ENABLED: ${NUXT_PUBLIC_TURNSTILE_ENABLED:-false}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    working_dir: /app
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Code monté pour l'itération, vendor géré par l'image.
      - ./apps/api:/app
      - api_vendor:/app/vendor
      - api_var:/app/var
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      APP_SECRET: ${APP_SECRET:-changeme_local_dev_only_never_used_for_signing}
      # Connexion PostgreSQL — le service `postgres` du réseau interne Compose.
      # `serverVersion=17` évite un ping runtime à Doctrine (voir ADR-009).
      DATABASE_URL: ${DATABASE_URL:-postgresql://devzair:devzair_local_password@postgres:5432/devzair?serverVersion=17&charset=utf8}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-no-reply@devzair.example}
      CONTACT_FROM_NAME: ${CONTACT_FROM_NAME:-Devzair — Site}
      CONTACT_RECIPIENT: ${CONTACT_RECIPIENT:-}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      CONTACT_RATE_LIMIT: ${CONTACT_RATE_LIMIT:-5}
      CONTACT_RATE_INTERVAL: ${CONTACT_RATE_INTERVAL:-10 minutes}
      CONTACT_ORIGIN_ALLOWLIST: ${CONTACT_ORIGIN_ALLOWLIST:-http://localhost:3001}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,REMOTE_ADDR}
      TRUSTED_HEADERS: ${TRUSTED_HEADERS:-x-forwarded-for,x-forwarded-proto,x-forwarded-host}
      # Administration Symfony (Phase 8C1, cf. ADR-012).
      # Durée de vie de la session admin en secondes (défaut : 8 heures).
      ADMIN_SESSION_LIFETIME: ${ADMIN_SESSION_LIFETIME:-28800}
      # Throttling natif Symfony sur /admin/login (login_throttling).
      ADMIN_LOGIN_MAX_ATTEMPTS: ${ADMIN_LOGIN_MAX_ATTEMPTS:-5}
      ADMIN_LOGIN_INTERVAL: ${ADMIN_LOGIN_INTERVAL:-15 minutes}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  postgres:
    # Version verrouillée sur 17-alpine (voir ADR-009). Toute évolution majeure
    # doit passer par une nouvelle ADR — un `latest` masquerait une régression
    # de compatibilité Doctrine ORM 3.
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devzair}
      POSTGRES_USER: ${POSTGRES_USER:-devzair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devzair_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` évite les faux départs où l'API tente de se connecter
      # avant que Postgres ait fini d'initialiser sa base.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devzair} -d ${POSTGRES_DB:-devzair}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Jamais publié sur l'hôte : accessible uniquement depuis le réseau interne
    # Compose, comme les services `web` et `api`.
    restart: unless-stopped

volumes:
  web_node_modules:
  web_nuxt_cache:
  api_vendor:
  api_var:
  postgres_data:
