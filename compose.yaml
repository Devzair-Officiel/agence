services:
  web:
    image: node:24-alpine
    working_dir: /app
    command: >
      sh -c "
      npm install &&
      npm run dev -- --host 0.0.0.0
      "
    ports:
      - "3001:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
    restart: unless-stopped

volumes:
  web_node_modules: