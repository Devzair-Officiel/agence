# Contrôles qualité du backend Symfony (apps/api) — Phase 6A + 8A.
#
# Un seul job avec un service Postgres 17 aligné sur compose.yaml :
#   - `composer validate --strict`     : cohérence du manifeste ;
#   - `bin/console lint:container`     : injection et paramètres résolvables ;
#   - `bin/console lint:yaml config`   : YAML syntaxiquement corrects ;
#   - `doctrine:migrations:migrate`    : applique les migrations sur devzair_test ;
#   - `doctrine:schema:validate`       : entités <-> schéma cohérents ;
#   - `phpunit`                        : DTO, endpoint, mailer, logs, sécurité,
#                                        domaine éditorial (Domain, App, Repo, HTTP).
#
# Aucune dépendance externe (Turnstile, Mailer) — désactivée en test.

name: api-quality

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-quality.yml'

concurrency:
  group: api-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: composer validate + lint + migrations + phpunit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: devzair_test
          POSTGRES_USER: devzair
          POSTGRES_PASSWORD: devzair_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devzair -d devzair_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # APP_ENV=test force la cascade Symfony vers .env.test.
      APP_ENV: test
      # Le service Postgres du workflow est exposé sur 127.0.0.1:5432 (pas
      # de résolution DNS "postgres" en dehors de Docker). Cette valeur écrase
      # DATABASE_URL définie dans .env.test (qui pointe vers le hostname Docker).
      DATABASE_URL: "postgresql://devzair:devzair_local_password@127.0.0.1:5432/devzair?serverVersion=17&charset=utf8"
      # EDITORIAL_MEDIA_STORAGE_DIR écrase la valeur de .env.test (/app/...) qui
      # n'est pas accessible sur le runner GitHub (pas de conteneur Docker).
      EDITORIAL_MEDIA_STORAGE_DIR: "${{ github.workspace }}/apps/api/var/test-storage/editorial-media"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, ctype, iconv, opcache, pdo_pgsql, gd
          ini-values: >-
            upload_max_filesize=12M,
            post_max_size=16M,
            memory_limit=256M,
            max_file_uploads=1
          coverage: none
          tools: composer:v2

      - name: Verify PHP upload limits
        run: |
          php -r '
            echo "upload_max_filesize=".ini_get("upload_max_filesize").PHP_EOL;
            echo "post_max_size=".ini_get("post_max_size").PHP_EOL;
            echo "memory_limit=".ini_get("memory_limit").PHP_EOL;
            echo "max_file_uploads=".ini_get("max_file_uploads").PHP_EOL;
          '

      - name: Prepare Symfony test environment
        # apps/api/.env et apps/api/.env.test sont gitignorés.
        # Symfony Runtime (autoload_runtime.php) appelle loadEnv('.env') qui
        # lève PathException si le fichier n'existe pas — avant même d'exécuter
        # composer install. On recrée les deux fichiers ici avec des valeurs
        # de test non-sensibles. Les variables critiques (DATABASE_URL,
        # EDITORIAL_MEDIA_STORAGE_DIR) sont surchargées par le job env ci-dessus.
        working-directory: apps/api
        run: |
          echo "APP_ENV=dev" > .env
          cat > .env.test << 'ENVEOF'
          APP_ENV=test
          APP_DEBUG=0
          APP_SECRET=test_secret_static_for_deterministic_hashing
          MAILER_DSN=null://null
          CONTACT_FROM_EMAIL=no-reply@devzair.test
          CONTACT_FROM_NAME="Devzair — Site"
          CONTACT_RECIPIENT=contact@devzair.test
          TURNSTILE_ENABLED=false
          TURNSTILE_SECRET=
          CONTACT_RATE_LIMIT=100
          CONTACT_RATE_INTERVAL="1 hour"
          CONTACT_ORIGIN_ALLOWLIST=http://localhost:3001,http://api.test
          TRUSTED_PROXIES=127.0.0.1,REMOTE_ADDR
          TRUSTED_HEADERS=x-forwarded-for,x-forwarded-proto,x-forwarded-host
          DATABASE_URL="postgresql://devzair:devzair_local_password@postgres:5432/devzair_test?serverVersion=17&charset=utf8"
          ADMIN_SESSION_LIFETIME=28800
          ADMIN_LOGIN_MAX_ATTEMPTS=5
          ADMIN_LOGIN_INTERVAL="15 minutes"
          EDITORIAL_MEDIA_STORAGE_DIR=/app/var/test-storage/editorial-media
          ADMIN_MEDIA_UPLOAD_LIMIT=1000
          ADMIN_MEDIA_UPLOAD_INTERVAL="1 hour"
          ESTIMATE_RATE_LIMIT=5
          ESTIMATE_RATE_INTERVAL="1 hour"
          ESTIMATE_LEAD_RATE_LIMIT=3
          ESTIMATE_LEAD_RATE_INTERVAL="1 hour"
          ESTIMATE_PARTNERSHIP_RATE_LIMIT=3
          ESTIMATE_PARTNERSHIP_RATE_INTERVAL="1 hour"
          APP_ADMIN_BASE_URL=http://localhost:8000
          N8N_EDITORIAL_TOKEN=test_n8n_token_static_for_deterministic_auth
          ENVEOF

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint YAML config
        run: php bin/console lint:yaml config --parse-tags

      - name: Lint DI container
        run: php bin/console lint:container --env=test

      - name: Run migrations on devzair_test
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Validate Doctrine schema (mapping <-> database)
        run: php bin/console doctrine:schema:validate --env=test

      - name: PHPUnit
        run: vendor/bin/phpunit --colors=never
