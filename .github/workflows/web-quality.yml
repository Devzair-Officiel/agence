# Contrôles qualité du frontend Nuxt (apps/web).
#
# Deux jobs indépendants et parallèles :
#   1. `quality` — lint, typecheck, tests unitaires, build (Node natif).
#   2. `e2e`     — tests Playwright sur un build de production, dans une
#      image officielle Playwright qui embarque Chromium et ses libs.
#
# La version de l'image Playwright doit rester alignée sur la version de
# `@playwright/test` dans `package.json` (mismatch = tests instables).
# À ce jour : @playwright/test 1.62.1 → mcr.microsoft.com/playwright:v1.62.1-noble.
#
# Le workflow ne déploie rien. Aucun secret n'est requis.

name: web-quality

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-quality.yml'

concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + typecheck + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Image officielle Playwright — Chromium et les dépendances système sont
    # déjà installés. La version est pinée sur celle de @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # HOME est requis par npm et Playwright pour écrire caches et rapports.
      options: --user 1001
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: 'true'
      HOME: /home/pwuser
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        # Le webServer défini dans playwright.config.ts builde puis démarre
        # Nitro en mode CI. Aucun serveur externe n'est requis.
        run: npm run test:e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
