# Contrôles qualité du frontend Nuxt (apps/web).
#
# Reproduit en CI ce qu'un dev fait localement via `npm run quality` :
# lint → typecheck → tests unitaires → build.
# Le workflow ne déploie rien. Il vise à empêcher qu'une régression bloquante
# atteigne `main` ou une pull request destinée à `main`.

name: web-quality

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-quality.yml'

# Annule les runs précédents encore en cours sur la même ref (économie CI).
concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + typecheck + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
