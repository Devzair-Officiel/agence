# Contrôles qualité du frontend Nuxt (apps/web).
#
# Deux jobs indépendants et parallèles :
#   1. `quality` — lint, typecheck, tests unitaires, build (Node natif).
#   2. `e2e`     — tests Playwright de bout en bout sur la topologie
#      docker compose réelle (Caddy + Nitro + Symfony + PostgreSQL). Playwright
#      appelle Caddy sur `http://localhost:3001`, jamais docker.sock
#      (voir DEC-086 et le brief Phase 8B2). Les fixtures éditoriales ET le
#      compte admin E2E sont chargés AVANT la suite et purgés APRÈS via
#      deux étapes `if: always()` distinctes, dont l'échec est propagé
#      (aucun `|| true` masquant, aucun cleanup silencieux).
#
# La version de l'image officielle Playwright a été retirée : Playwright
# est désormais exécuté sur le runner GitHub (Ubuntu) via
# `npx playwright install --with-deps chromium`. Cela :
#   - permet à Playwright de dialoguer avec docker compose côté runner
#     (impossible depuis un conteneur sans exposer docker.sock) ;
#   - fait disparaître le problème de `test-results/` créés en `root` par
#     un conteneur avec `--user 1001` et rejetés par le cleanup du runner
#     (pas de `chmod -R 777` requis, pas de workaround).
#
# Le workflow ne déploie rien. Aucun secret n'est requis.

name: web-quality

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'infra/**'
      - 'scripts/e2e-fixtures.sh'
      - 'scripts/e2e-admin-user.sh'
      - 'scripts/e2e-admin-articles.sh'
      - 'compose.yaml'
      - '.env.example'
      - '.github/workflows/web-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'infra/**'
      - 'scripts/e2e-fixtures.sh'
      - 'scripts/e2e-admin-user.sh'
      - 'scripts/e2e-admin-articles.sh'
      - 'compose.yaml'
      - '.env.example'
      - '.github/workflows/web-quality.yml'

concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + typecheck + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: playwright (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Playwright pointe sur Caddy — la seule surface publique de la stack.
      PLAYWRIGHT_BASE_URL: http://localhost:3001
      # Compte E2E dédié (RFC 6761 `example.test`) — provisionné plus bas via
      # `app:admin:create-user`. Jamais confondu avec un compte de production.
      ADMIN_TEST_EMAIL: e2e-admin@example.test
      ADMIN_TEST_PASSWORD: DevzairAdmin!2026
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers (chromium + system deps)
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Start docker compose stack
        # `--wait` fait attendre les services ayant un healthcheck (postgres).
        # api/web/caddy n'ont pas de healthcheck dans compose.yaml — on gère
        # leur readiness par polling HTTP explicite juste après.
        run: docker compose up -d --build --wait

      - name: Wait for API readiness (http://localhost via Caddy)
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/health > /dev/null; then
              echo "API prête après ${attempt} tentative(s)."
              exit 0
            fi
            sleep 2
          done
          echo "API pas prête après 120 s — diagnostic :" >&2
          docker compose ps
          docker compose logs --tail=200 api caddy postgres
          exit 1

      - name: Wait for Nuxt readiness (http://localhost via Caddy)
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3001/; then
              echo "Nuxt prêt après ${attempt} tentative(s)."
              exit 0
            fi
            sleep 2
          done
          echo "Nuxt pas prêt après 120 s — diagnostic :" >&2
          docker compose ps
          docker compose logs --tail=200 web caddy
          exit 1

      - name: Run Doctrine migrations (dev database)
        run: docker compose exec -T api bin/console doctrine:migrations:migrate --no-interaction

      - name: Load editorial E2E fixtures (e2e-8b2-*)
        # Le script scripts/e2e-fixtures.sh appelle la commande CLI Symfony
        # `app:editorial:e2e-fixtures load` scopée dev/test (voir DEC-086).
        run: ./scripts/e2e-fixtures.sh load

      - name: Provision E2E admin account (idempotent)
        # scripts/e2e-admin-user.sh load : `--password-stdin` (aucune fuite
        # dans `ps`), compte codé en dur `e2e-admin@example.test` (RFC 6761,
        # jamais confondable avec un opérateur). Idempotent : réinvocation
        # sans effet si le compte existe déjà.
        run: ./scripts/e2e-admin-user.sh load

      - name: Ensure clean state for admin editorial E2E (e2e-8c3-*)
        # La suite admin-editorial.spec.ts CRÉE ses articles via l'UI ;
        # ce `load` ne préremplit rien mais purge tout résidu d'un run
        # précédent qui aurait crashé avant `clear`. Préfixe strict
        # `e2e-8c3-`, DELETE ciblé — voir en-tête du script.
        run: ./scripts/e2e-admin-articles.sh load

      - name: Run Playwright tests
        working-directory: apps/web
        env:
          CI: 'true'
        # `webServer` de playwright.config.ts est court-circuité quand
        # `PLAYWRIGHT_BASE_URL` est posé : Playwright ne redémarre pas Nuxt,
        # il appelle directement Caddy → Nitro/Symfony via la stack docker.
        run: npx playwright test

      - name: Clear editorial E2E fixtures
        # `if: always()` — la purge doit s'exécuter même si Playwright a
        # échoué, sinon les runs suivants héritent des lignes `e2e-8b2-*`.
        # Pas de `|| true` : un échec de purge doit faire rougir le job,
        # sinon on masque une dérive silencieuse de la base.
        if: always()
        run: ./scripts/e2e-fixtures.sh clear

      - name: Clear E2E admin account
        # Purge symétrique à la précédente. Le script cible strictement
        # `normalized_email = 'e2e-admin@example.test'` — jamais
        # `admin@devzair.local`, jamais un DELETE sans clause.
        if: always()
        run: ./scripts/e2e-admin-user.sh clear

      - name: Clear admin editorial E2E articles (e2e-8c3-*)
        # Purge post-suite : DELETE ciblé `slug LIKE 'e2e-8c3-%'`. Symétrique
        # au load ci-dessus ; `if: always()` pour ne jamais laisser de résidu
        # en cas d'échec Playwright.
        if: always()
        run: ./scripts/e2e-admin-articles.sh clear

      - name: Collect docker compose logs (on failure)
        if: failure()
        run: |
          mkdir -p artifacts/logs
          docker compose logs --no-color api > artifacts/logs/api.log || true
          docker compose logs --no-color web > artifacts/logs/web.log || true
          docker compose logs --no-color caddy > artifacts/logs/caddy.log || true
          docker compose logs --no-color postgres > artifacts/logs/postgres.log || true

      - name: Stop docker compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload docker compose logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: artifacts/logs/
          retention-days: 7
