# Devzair — routes d'administration (Phase 8C1, voir ADR-012).
#
# Contrairement aux routes publiques (/api/*, préfixe strippé par Caddy),
# ces routes sont exposées AVEC leur préfixe `/admin` — le handle Caddy
# `@admin` ne strippe rien. C'est ce préfixe qui déclenche le firewall
# `admin` défini dans security.yaml.

admin_login:
    path: /admin/login
    controller: App\Admin\Presentation\Http\AdminLoginController::__invoke
    methods: [GET, POST]

admin_dashboard:
    path: /admin
    controller: App\Admin\Presentation\Http\AdminDashboardController::__invoke
    methods: [GET]

# La route `admin_logout` est branchée par la security bundle (attribut
# `logout.path` dans security.yaml). Aucun contrôleur métier n'est nécessaire :
# Symfony intercepte, purge la session et redirige.
admin_logout:
    path: /admin/logout
    methods: [POST]

# Administration éditoriale (Phase 8C3, voir ADR-013 à ajouter).
# Toutes ces routes sont protégées par `access_control ^/admin ROLE_ADMIN`.
admin_articles_list:
    path: /admin/articles
    controller: App\Admin\Presentation\Http\AdminArticleListController::__invoke
    methods: [GET]

admin_article_create:
    path: /admin/articles/new
    controller: App\Admin\Presentation\Http\AdminArticleCreateController::__invoke
    methods: [GET, POST]

admin_article_edit:
    path: /admin/articles/{id}/edit
    controller: App\Admin\Presentation\Http\AdminArticleEditController::__invoke
    methods: [GET, POST]
    requirements:
        id: '[0-9a-fA-F-]{36}'

# Prévisualisation admin authentifiée (Phase 8C4). GET uniquement — aucune
# mutation possible. Le UUID est doublement validé : regex de route +
# `Uuid::fromString()` côté contrôleur.
admin_article_preview:
    path: /admin/articles/{id}/preview
    controller: App\Admin\Presentation\Http\AdminArticlePreviewController::__invoke
    methods: [GET]
    requirements:
        id: '[0-9a-fA-F-]{36}'

admin_article_publish:
    path: /admin/articles/{id}/publish
    controller: App\Admin\Presentation\Http\AdminArticlePublishController::__invoke
    methods: [POST]
    requirements:
        id: '[0-9a-fA-F-]{36}'

admin_article_archive:
    path: /admin/articles/{id}/archive
    controller: App\Admin\Presentation\Http\AdminArticleArchiveController::__invoke
    methods: [POST]
    requirements:
        id: '[0-9a-fA-F-]{36}'

admin_article_restore:
    path: /admin/articles/{id}/restore
    controller: App\Admin\Presentation\Http\AdminArticleRestoreController::__invoke
    methods: [POST]
    requirements:
        id: '[0-9a-fA-F-]{36}'

# Image principale d'un brouillon (Phase 9B). GET rend le chooser paginé
# (radio + champ alt), POST applique la sélection. La route de retrait est
# POST-only et déclenchée depuis l'écran d'édition.
admin_article_hero_image:
    path: /admin/articles/{id}/image
    controller: App\Admin\Presentation\Http\AdminArticleHeroImageController::__invoke
    methods: [GET, POST]
    requirements:
        id: '[0-9a-fA-F-]{36}'

admin_article_hero_image_remove:
    path: /admin/articles/{id}/image/remove
    controller: App\Admin\Presentation\Http\AdminArticleHeroImageRemoveController::__invoke
    methods: [POST]
    requirements:
        id: '[0-9a-fA-F-]{36}'

# Administration des médias éditoriaux (Phase 9A).
# Toutes ces routes sont protégées par `access_control ^/admin ROLE_ADMIN`.
# En 9A, seules la liste, la création (formulaire + POST) et la prévisualisation
# authentifiée existent — pas de DELETE (voir §5 du brief).
admin_media_list:
    path: /admin/media
    controller: App\Admin\Presentation\Http\AdminMediaListController::__invoke
    methods: [GET]

admin_media_upload:
    path: /admin/media/new
    controller: App\Admin\Presentation\Http\AdminMediaUploadController::__invoke
    methods: [GET, POST]

admin_media_preview:
    path: /admin/media/{id}/preview
    controller: App\Admin\Presentation\Http\AdminMediaPreviewController::__invoke
    methods: [GET]
    requirements:
        id: '[0-9a-fA-F-]{36}'

# Administration des grilles tarifaires estimateur (EST-8).
# Toutes ces routes sont protégées par `access_control ^/admin ROLE_ADMIN`.
admin_pricing_list:
    path: /admin/pricing
    controller: App\Admin\Presentation\Http\AdminEstimatorPricingListController::__invoke
    methods: [GET]

admin_pricing_new:
    path: /admin/pricing/new
    controller: App\Admin\Presentation\Http\AdminEstimatorPricingNewController::__invoke
    methods: [GET, POST]

admin_pricing_show:
    path: /admin/pricing/{id}
    controller: App\Admin\Presentation\Http\AdminEstimatorPricingShowController::__invoke
    methods: [GET]
    requirements:
        id: '[0-9a-fA-F-]{36}'

admin_pricing_edit:
    path: /admin/pricing/{id}/edit
    controller: App\Admin\Presentation\Http\AdminEstimatorPricingEditController::__invoke
    methods: [GET, POST]
    requirements:
        id: '[0-9a-fA-F-]{36}'

admin_pricing_publish:
    path: /admin/pricing/{id}/publish
    controller: App\Admin\Presentation\Http\AdminEstimatorPricingPublishController::__invoke
    methods: [POST]
    requirements:
        id: '[0-9a-fA-F-]{36}'

admin_pricing_delete:
    path: /admin/pricing/{id}/delete
    controller: App\Admin\Presentation\Http\AdminEstimatorPricingDeleteController::__invoke
    methods: [POST]
    requirements:
        id: '[0-9a-fA-F-]{36}'
