# Configuration des services de l'application.
#
# Convention (voir AGENTS.md §6) :
# - controller : reçoit la requête, délègue à un service, formatte la réponse ;
# - service    : porte le cas d'usage ;
# - interface  : contrat stable, remplacé par un fake en test.

parameters:
    app.editorial_media.storage_dir: '%env(default::EDITORIAL_MEDIA_STORAGE_DIR)%'
    app.contact.rate_limit: '%env(int:CONTACT_RATE_LIMIT)%'
    app.contact.rate_interval: '%env(CONTACT_RATE_INTERVAL)%'
    app.estimate.rate_limit: '%env(int:ESTIMATE_RATE_LIMIT)%'
    app.estimate.rate_interval: '%env(ESTIMATE_RATE_INTERVAL)%'
    app.estimate_lead.rate_limit: '%env(int:ESTIMATE_LEAD_RATE_LIMIT)%'
    app.estimate_lead.rate_interval: '%env(ESTIMATE_LEAD_RATE_INTERVAL)%'
    app.estimate_partnership.rate_limit: '%env(int:ESTIMATE_PARTNERSHIP_RATE_LIMIT)%'
    app.estimate_partnership.rate_interval: '%env(ESTIMATE_PARTNERSHIP_RATE_INTERVAL)%'
    app.contact.from_email: '%env(CONTACT_FROM_EMAIL)%'
    app.contact.from_name: '%env(CONTACT_FROM_NAME)%'
    app.contact.recipient: '%env(default::CONTACT_RECIPIENT)%'
    app.contact.origin_allowlist: '%env(csv:CONTACT_ORIGIN_ALLOWLIST)%'
    app.turnstile.enabled: '%env(bool:TURNSTILE_ENABLED)%'
    app.turnstile.secret: '%env(default::TURNSTILE_SECRET)%'
    app.site.indexable: '%env(bool:default::NUXT_PUBLIC_SITE_INDEXABLE)%'
    app.mailer.dsn: '%env(MAILER_DSN)%'
    app.trusted_proxies: '%env(default::TRUSTED_PROXIES)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            # Force l'injection du canal Monolog "contact" à chaque service
            # qui demande un $contactLogger.
            Psr\Log\LoggerInterface $contactLogger: '@monolog.logger.contact'
            # Canal dédié aux lectures publiques éditoriales — utile pour
            # observer indépendamment le trafic Phase 8A.
            Psr\Log\LoggerInterface $editorialLogger: '@monolog.logger.editorial'
            # Canal dédié aux événements admin (login success/failure, logout,
            # opérations CLI de gestion de comptes). Voir ADR-012.
            Psr\Log\LoggerInterface $adminLogger: '@monolog.logger.admin'
            # Canal dédié à l'endpoint POST /api/estimate (EST-1C).
            Psr\Log\LoggerInterface $estimatorLogger: '@monolog.logger.estimator'
            # Canal dédié à l'endpoint POST /api/estimate/lead (EST-6).
            Psr\Log\LoggerInterface $estimatorLeadLogger: '@monolog.logger.estimator_lead'
            # Canal dédié à l'endpoint POST /api/estimate/partnership (EST-7).
            Psr\Log\LoggerInterface $estimatorPartnershipLogger: '@monolog.logger.estimator_partnership'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Kernel.php'

    # Sélection explicite de l'implémentation Turnstile selon la config.
    # En dev/test (TURNSTILE_ENABLED=false), on autorise systématiquement ;
    # en prod, on branche le vrai vérificateur Cloudflare.
    App\Contact\Security\TurnstileVerifierInterface:
        factory: ['@App\Contact\Security\TurnstileVerifierFactory', 'create']

    App\Contact\Security\TurnstileVerifierFactory:
        arguments:
            $enabled: '%app.turnstile.enabled%'
            $secret: '%app.turnstile.secret%'
            $httpClient: '@Symfony\Contracts\HttpClient\HttpClientInterface'
            $logger: '@logger'

    App\Contact\Service\ContactMessageSenderInterface:
        alias: App\Contact\Service\SymfonyContactMessageSender

    App\Contact\Service\SymfonyContactMessageSender:
        arguments:
            $fromEmail: '%app.contact.from_email%'
            $fromName: '%app.contact.from_name%'
            $recipient: '%app.contact.recipient%'

    App\Contact\Security\OriginAllowlist:
        arguments:
            $allowlist: '%app.contact.origin_allowlist%'

    App\Contact\Configuration\ContactConfigurationValidator:
        arguments:
            $appEnv: '%kernel.environment%'
            $mailerDsn: '%app.mailer.dsn%'
            $fromEmail: '%app.contact.from_email%'
            $fromName: '%app.contact.from_name%'
            $recipient: '%app.contact.recipient%'
            $turnstileEnabled: '%app.turnstile.enabled%'
            $turnstileSecret: '%app.turnstile.secret%'
            $originAllowlist: '%app.contact.origin_allowlist%'
            $trustedProxies: '%app.trusted_proxies%'

    App\Contact\Security\ContactRateLimiter:
        arguments:
            $limiterFactory: '@limiter.contact_ip'

    App\Estimator\Infrastructure\Security\EstimateRateLimiter:
        arguments:
            $limiterFactory: '@limiter.estimate_ip'

    App\Estimator\Infrastructure\Security\EstimateLeadRateLimiter:
        arguments:
            $limiterFactory: '@limiter.estimate_lead_ip'

    App\Estimator\Domain\Lead\EstimatorLeadRepositoryInterface:
        alias: App\Estimator\Infrastructure\Persistence\DoctrineEstimatorLeadRepository

    App\Estimator\Application\Lead\EstimatorLeadNotifier:
        arguments:
            $fromEmail: '%app.contact.from_email%'
            $fromName:  '%app.contact.from_name%'
            $recipient: '%app.contact.recipient%'
            $adminBaseUrl: '%env(default::APP_ADMIN_BASE_URL)%'

    App\Estimator\Application\Partnership\EstimatorPartnershipNotifier:
        arguments:
            $fromEmail: '%app.contact.from_email%'
            $fromName:  '%app.contact.from_name%'
            $recipient: '%app.contact.recipient%'
            $adminBaseUrl: '%env(default::APP_ADMIN_BASE_URL)%'

    App\Estimator\Infrastructure\Security\EstimatePartnershipRateLimiter:
        arguments:
            $limiterFactory: '@limiter.estimate_partnership_ip'

    App\Estimator\Domain\Partnership\EstimatorPartnershipRepositoryInterface:
        alias: App\Estimator\Infrastructure\Persistence\DoctrineEstimatorPartnershipRepository

    App\EventListener\ApiExceptionListener:
        arguments:
            $debug: '%kernel.debug%'

    # Domaine éditorial (Phase 8A). L'implémentation par défaut du port est
    # Doctrine ; les tests unitaires application/domaine utilisent la variante
    # en mémoire déclarée dans services_test.yaml.
    App\Editorial\Domain\ArticleRepositoryInterface:
        alias: App\Editorial\Infrastructure\Persistence\DoctrineArticleRepository

    # Port de lecture admin (Phase 8C3) — séparé du port public pour préserver
    # l'invariant « lectures publiques doublement filtrées ».
    App\Editorial\Application\Query\AdminArticleReadRepositoryInterface:
        alias: App\Editorial\Infrastructure\Persistence\DoctrineAdminArticleReadRepository

    # Limiteur de débit par admin authentifié (Phase 8C3). Deux fenêtres
    # distinctes : `admin_write` (60/5min, mutations non-publiantes) et
    # `admin_publish` (20/5min, transition Draft→Published). Les compteurs
    # sont indexés par UUID d'admin — voir `AdminActionRateLimiter`.
    App\Admin\Infrastructure\Security\AdminActionRateLimiter:
        arguments:
            $adminWriteLimiter: '@limiter.admin_write'
            $adminPublishLimiter: '@limiter.admin_publish'

    App\Editorial\Domain\Clock\ClockInterface:
        alias: App\Editorial\Domain\Clock\SystemClock

    # Moteur tarifaire Estimateur (EST-8). La grille active est chargée depuis
    # la base de données (version publiée). ActivePricingCatalog est lazy et
    # fail-closed : lève NoPricingConfigurationAvailableException si aucune
    # version publiée n'existe. DevzairPricingCatalogV1 reste utilisé comme
    # référence et fixture de parité dans les tests.
    App\Estimator\Application\Pricing\PricingCatalogInterface:
        alias: App\Estimator\Application\Pricing\ActivePricingCatalog

    App\Estimator\Domain\Pricing\PricingConfigurationRepositoryInterface:
        alias: App\Estimator\Infrastructure\Persistence\DoctrineEstimatorPricingRepository

    # Binding du logger admin (canal `admin`) pour PricingAdminAuditLogger.
    # EditorialAdminAuditLogger utilise déjà ce même binding via autowire.
    App\Admin\Infrastructure\Logging\PricingAdminAuditLogger:
        arguments:
            $adminLogger: '@monolog.logger.admin'

    # Domaine Admin (Phase 8C1). Le port est branché sur l'adaptateur Doctrine ;
    # une variante en mémoire pour les tests unitaires est déclarée dans
    # services_test.yaml. L'horloge PSR-20 est fournie par le composant Symfony
    # Clock (transitif via security-bundle).
    App\Admin\Domain\AdminUserRepositoryInterface:
        alias: App\Admin\Infrastructure\Persistence\DoctrineAdminUserRepository

    # NativeClock vit hors du namespace `App\` : le bloc resource `../src/`
    # ne le découvre pas. Registration explicite pour que l'alias PSR-20 ci-
    # dessous puisse résoudre. Les tests peuvent surcharger via
    # `getContainer()->set(NativeClock::class, $frozenClock)` pour geler l'instant.
    Symfony\Component\Clock\NativeClock: ~

    Psr\Clock\ClockInterface:
        alias: Symfony\Component\Clock\NativeClock

    # Domaine EditorialMedia (Phase 9A). Le port de persistance est branché sur
    # Doctrine ; l'implémentation par défaut du stockage privé écrit sur disque
    # dans un répertoire hors webroot. Le processeur d'image et le détecteur
    # MIME utilisent respectivement GD et l'extension fileinfo.
    App\EditorialMedia\Domain\MediaAssetRepositoryInterface:
        alias: App\EditorialMedia\Infrastructure\Persistence\DoctrineMediaAssetRepository

    App\EditorialMedia\Application\Storage\MediaStorageInterface:
        alias: App\EditorialMedia\Infrastructure\Storage\LocalMediaStorage

    App\EditorialMedia\Infrastructure\Storage\LocalMediaStorage:
        arguments:
            $storageRoot: '%app.editorial_media.storage_dir%'

    App\EditorialMedia\Application\Image\ImageProcessorInterface:
        alias: App\EditorialMedia\Infrastructure\Image\GdImageProcessor

    App\EditorialMedia\Application\Mime\MimeTypeDetectorInterface:
        alias: App\EditorialMedia\Infrastructure\Mime\FinfoMimeTypeDetector

    # Limiteur d'upload par admin authentifié (Phase 9A). Fenêtre glissante
    # 20 uploads / 10 minutes, indexée par UUID d'admin — voir §11 du brief.
    App\EditorialMedia\Infrastructure\Security\AdminMediaUploadRateLimiter:
        arguments:
            $limiterFactory: '@limiter.admin_media_upload'

    # Adaptateur ANTI-CORRUPTION-LAYER entre `Editorial` et `EditorialMedia`
    # (Phase 9B). Un unique service implémente les deux ports du contexte
    # `Editorial` : le lookup binaire (mutations) et le reader (read-models
    # admin/publique). Les deux alias pointent explicitement sur cette
    # implémentation — pas d'autowiring implicite sur l'interface pour
    # rester lisible.
    App\Editorial\Application\Media\MediaAssetLookupInterface:
        alias: App\EditorialMedia\Infrastructure\Adapter\EditorialMediaAssetLookup

    App\Editorial\Application\Media\MediaAssetReaderInterface:
        alias: App\EditorialMedia\Infrastructure\Adapter\EditorialMediaAssetLookup

    # Diffusion publique des médias (Phase 9B). Deux ports séparés :
    #   - `PublicMediaGateInterface` (SQL brut sur editorial_article) porté
    #     par `Editorial` — la règle « référencé par un Published » vit dans
    #     le contexte aval qui la définit.
    #   - `PublicMediaStreamerInterface` porté par `EditorialMedia` — c'est
    #     lui qui possède le fichier physique et son mime.
    App\Editorial\Application\Media\PublicMediaGateInterface:
        alias: App\Editorial\Infrastructure\Persistence\DoctrinePublicMediaGate

    App\Editorial\Application\Media\PublicMediaStreamerInterface:
        alias: App\EditorialMedia\Infrastructure\Adapter\EditorialMediaPublicStreamer

    App\EditorialMedia\Infrastructure\Adapter\EditorialMediaPublicStreamer:
        arguments:
            $editorialMediaLogger: '@logger'
