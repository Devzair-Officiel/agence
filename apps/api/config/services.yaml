# Configuration des services de l'application.
#
# Convention (voir AGENTS.md §6) :
# - controller : reçoit la requête, délègue à un service, formatte la réponse ;
# - service    : porte le cas d'usage ;
# - interface  : contrat stable, remplacé par un fake en test.

parameters:
    app.contact.rate_limit: '%env(int:CONTACT_RATE_LIMIT)%'
    app.contact.rate_interval: '%env(CONTACT_RATE_INTERVAL)%'
    app.contact.from_email: '%env(CONTACT_FROM_EMAIL)%'
    app.contact.from_name: '%env(CONTACT_FROM_NAME)%'
    app.contact.recipient: '%env(default::CONTACT_RECIPIENT)%'
    app.contact.origin_allowlist: '%env(csv:CONTACT_ORIGIN_ALLOWLIST)%'
    app.turnstile.enabled: '%env(bool:TURNSTILE_ENABLED)%'
    app.turnstile.secret: '%env(default::TURNSTILE_SECRET)%'
    app.site.indexable: '%env(bool:default::NUXT_PUBLIC_SITE_INDEXABLE)%'
    app.mailer.dsn: '%env(MAILER_DSN)%'
    app.trusted_proxies: '%env(default::TRUSTED_PROXIES)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            # Force l'injection du canal Monolog "contact" à chaque service
            # qui demande un $contactLogger.
            Psr\Log\LoggerInterface $contactLogger: '@monolog.logger.contact'
            # Canal dédié aux lectures publiques éditoriales — utile pour
            # observer indépendamment le trafic Phase 8A.
            Psr\Log\LoggerInterface $editorialLogger: '@monolog.logger.editorial'
            # Canal dédié aux événements admin (login success/failure, logout,
            # opérations CLI de gestion de comptes). Voir ADR-012.
            Psr\Log\LoggerInterface $adminLogger: '@monolog.logger.admin'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Kernel.php'

    # Sélection explicite de l'implémentation Turnstile selon la config.
    # En dev/test (TURNSTILE_ENABLED=false), on autorise systématiquement ;
    # en prod, on branche le vrai vérificateur Cloudflare.
    App\Contact\Security\TurnstileVerifierInterface:
        factory: ['@App\Contact\Security\TurnstileVerifierFactory', 'create']

    App\Contact\Security\TurnstileVerifierFactory:
        arguments:
            $enabled: '%app.turnstile.enabled%'
            $secret: '%app.turnstile.secret%'
            $httpClient: '@Symfony\Contracts\HttpClient\HttpClientInterface'
            $logger: '@logger'

    App\Contact\Service\ContactMessageSenderInterface:
        alias: App\Contact\Service\SymfonyContactMessageSender

    App\Contact\Service\SymfonyContactMessageSender:
        arguments:
            $fromEmail: '%app.contact.from_email%'
            $fromName: '%app.contact.from_name%'
            $recipient: '%app.contact.recipient%'

    App\Contact\Security\OriginAllowlist:
        arguments:
            $allowlist: '%app.contact.origin_allowlist%'

    App\Contact\Configuration\ContactConfigurationValidator:
        arguments:
            $appEnv: '%kernel.environment%'
            $mailerDsn: '%app.mailer.dsn%'
            $fromEmail: '%app.contact.from_email%'
            $fromName: '%app.contact.from_name%'
            $recipient: '%app.contact.recipient%'
            $turnstileEnabled: '%app.turnstile.enabled%'
            $turnstileSecret: '%app.turnstile.secret%'
            $originAllowlist: '%app.contact.origin_allowlist%'
            $trustedProxies: '%app.trusted_proxies%'

    App\Contact\Security\ContactRateLimiter:
        arguments:
            $limiterFactory: '@limiter.contact_ip'

    App\EventListener\ApiExceptionListener:
        arguments:
            $debug: '%kernel.debug%'

    # Domaine éditorial (Phase 8A). L'implémentation par défaut du port est
    # Doctrine ; les tests unitaires application/domaine utilisent la variante
    # en mémoire déclarée dans services_test.yaml.
    App\Editorial\Domain\ArticleRepositoryInterface:
        alias: App\Editorial\Infrastructure\Persistence\DoctrineArticleRepository

    App\Editorial\Domain\Clock\ClockInterface:
        alias: App\Editorial\Domain\Clock\SystemClock

    # Domaine Admin (Phase 8C1). Le port est branché sur l'adaptateur Doctrine ;
    # une variante en mémoire pour les tests unitaires est déclarée dans
    # services_test.yaml. L'horloge PSR-20 est fournie par le composant Symfony
    # Clock (transitif via security-bundle).
    App\Admin\Domain\AdminUserRepositoryInterface:
        alias: App\Admin\Infrastructure\Persistence\DoctrineAdminUserRepository

    # NativeClock vit hors du namespace `App\` : le bloc resource `../src/`
    # ne le découvre pas. Registration explicite pour que l'alias PSR-20 ci-
    # dessous puisse résoudre. Les tests peuvent surcharger via
    # `getContainer()->set(NativeClock::class, $frozenClock)` pour geler l'instant.
    Symfony\Component\Clock\NativeClock: ~

    Psr\Clock\ClockInterface:
        alias: Symfony\Component\Clock\NativeClock
