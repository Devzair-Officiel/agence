# Routes exposées par l'API. Deux familles :
# - `/contact`, `/health`, `/resources` : Caddy strippe le préfixe `/api`
#   avant le forward — les routes ci-dessous sont donc écrites sans `/api`.
# - `/admin/*` (Phase 8C1, cf. `routes/admin.yaml`) : Caddy PRÉSERVE le
#   préfixe pour que le pattern firewall `^/admin` matche côté Symfony.

admin_routes:
    resource: routes/admin.yaml

contact_submission:
    path: /contact
    controller: App\Contact\Controller\ContactSubmissionController::__invoke
    methods: [POST]

health_check:
    path: /health
    controller: App\Contact\Controller\HealthController::__invoke
    methods: [GET]

editorial_list:
    path: /resources
    controller: App\Editorial\Presentation\Http\ListPublishedArticlesController::__invoke
    methods: [GET]

editorial_detail:
    path: /resources/{slug}
    controller: App\Editorial\Presentation\Http\GetPublishedArticleController::__invoke
    methods: [GET]
    # Contrainte simple pour éviter que la table de routage attrape des slugs
    # avec slash. La validation stricte est faite dans le VO ArticleSlug.
    requirements:
        slug: '[a-z0-9\-]+'
