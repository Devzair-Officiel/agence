framework:
    secret: '%env(APP_SECRET)%'
    # HttpFoundation + trusted proxies : Caddy est en frontal.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']
    http_method_override: false
    handle_all_throwables: true

    # Sessions activées pour la Phase 8C1 (authentification admin).
    #
    # Le cookie porte un nom dédié `DZ_ADMIN_SESSID` : il ne peut jamais être
    # confondu avec un cookie public émis par Nuxt (le domaine public reste
    # servi en stateless). En dev, `cookie_secure: auto` laisse HTTP passer ;
    # en prod, HTTPS obligatoire (voir docs/checklists/PRODUCTION-CONTACT.md
    # à étendre lors de la mise en prod admin).
    #
    # `cookie_samesite: lax` permet à un lien externe légitime de revenir sur
    # l'admin sans effet de bord (les actions d'écriture Phase 8C1 se limitent
    # à `POST /admin/login` et `POST /admin/logout`, tous deux protégés CSRF).
    session:
        enabled: true
        # `handler_id: null` = stockage filesystem (défaut Symfony). Pas de
        # Redis pour Phase 8C1 (un seul conteneur `api`, filesystem suffit).
        handler_id: null
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax
        name: DZ_ADMIN_SESSID
        # Durée d'inactivité côté cookie (0 = fermeture du navigateur), la
        # durée serveur est gérée par `gc_maxlifetime`. On aligne les deux via
        # `cookie_lifetime` = `gc_maxlifetime` = ADMIN_SESSION_LIFETIME.
        cookie_lifetime: '%env(int:ADMIN_SESSION_LIFETIME)%'
        gc_maxlifetime: '%env(int:ADMIN_SESSION_LIFETIME)%'

    php_errors:
        log: true

    rate_limiter:
        contact_ip:
            policy: 'token_bucket'
            limit: '%app.contact.rate_limit%'
            rate: { interval: '%app.contact.rate_interval%', amount: '%app.contact.rate_limit%' }

        # Écritures admin non-publiantes (create, update, archive, restore).
        # Fenêtre confortable (60 requêtes / 5 min) — les admins réels ne
        # dépassent jamais ces débits, mais un script détourné ou un onglet
        # « bouclé » (F5 répété) se voit refuser à 429 avant d'atteindre la
        # base. La clef est l'UUID de l'admin authentifié (voir
        # `AdminActionRateLimiter`) — un compteur par identité.
        admin_write:
            policy: 'token_bucket'
            limit: 60
            rate: { interval: '5 minutes', amount: 60 }

        # Publications (transition Draft → Published). Débit plus serré
        # (20 requêtes / 5 min) : la publication est un acte éditorial rare
        # et coûteux (visibilité publique + invalidation ETag). 20 tentatives
        # par admin et par tranche de 5 min laissent largement place à une
        # session d'édition normale mais coupent un scripting anormal.
        admin_publish:
            policy: 'token_bucket'
            limit: 20
            rate: { interval: '5 minutes', amount: 20 }

    serializer:
        enabled: true

when@test:
    framework:
        test: true
        session:
            # Le storage `mock_file` évite de créer de vrais fichiers de session
            # pendant les tests et supprime la nécessité d'un `session_start`
            # avant l'envoi des headers.
            storage_factory_id: session.storage.factory.mock_file
