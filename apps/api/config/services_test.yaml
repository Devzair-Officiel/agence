# Overrides pour l'environnement de test.
# Remplace le sender réel par un fake en mémoire, et publie les services
# du package Contact avec visibilité publique pour que les tests puissent
# les récupérer depuis le container.

services:
    _defaults:
        # Ré-active autowire/autoconfigure : sans cela, chaque service publié
        # ci-dessous perd l'injection des arguments qu'il tenait du groupe
        # `App\` déclaré dans services.yaml (Symfony ne cascade pas les
        # `_defaults` entre fichiers de config).
        autowire: true
        autoconfigure: true
        public: true

    App\Contact\Service\InMemoryContactMessageSender:
        public: true

    App\Contact\Service\ContactMessageSenderInterface:
        alias: App\Contact\Service\InMemoryContactMessageSender
        public: true

    # Force le rate limiter à utiliser un cache en mémoire, isolé par kernel :
    # chaque `createClient()` reboot le kernel, chaque test repart d'un bucket
    # neuf. Sans cette override, le cache par défaut est persistant et l'ordre
    # aléatoire des tests fait exhauster la limite pour les tests suivants.
    limiter.storage.contact_ip:
        class: Symfony\Component\RateLimiter\Storage\InMemoryStorage
        public: true

    limiter.contact_ip:
        class: Symfony\Component\RateLimiter\RateLimiterFactory
        arguments:
            - policy: 'token_bucket'
              id: 'contact_ip'
              limit: '%app.contact.rate_limit%'
              rate: { interval: '%app.contact.rate_interval%', amount: '%app.contact.rate_limit%' }
            - '@limiter.storage.contact_ip'
        public: true

    # ------------------------------------------------------------------
    # Domaine éditorial (Phase 8A)
    # ------------------------------------------------------------------
    # Les tests d'intégration Doctrine (repository) et les tests HTTP
    # (controllers) laissent l'implémentation réelle branchée sur la base
    # `devzair_test`. Les tests unitaires Application/Domain n'utilisent pas
    # le container Symfony : ils construisent handler + `InMemoryArticleRepository`
    # à la main. Rien à surcharger ici.
    App\Editorial\Infrastructure\Persistence\DoctrineArticleRepository:
        public: true

    App\Editorial\Application\Query\ListPublishedArticlesHandler:
        public: true

    App\Editorial\Application\Query\GetPublishedArticleHandler:
        public: true

    # Rendu public pour permettre aux tests d'intégration Doctrine et aux
    # tests HTTP d'accéder à l'EntityManager (flush après insertion via
    # ArticleBuilder, nettoyage entre cas).
    Doctrine\ORM\EntityManagerInterface:
        alias: doctrine.orm.default_entity_manager
        public: true

    # ------------------------------------------------------------------
    # Domaine Admin (Phase 8C1)
    # ------------------------------------------------------------------
    # Les tests intégration Doctrine + tests HTTP utilisent la base
    # `devzair_test` réelle. Les services suivants sont publiés pour que
    # les tests puissent instancier des cas d'usage et vérifier l'état.
    App\Admin\Infrastructure\Persistence\DoctrineAdminUserRepository:
        public: true

    App\Admin\Application\AdminAccountService:
        public: true

    App\Admin\Presentation\Console\CreateAdminUserCommand:
        public: true

    App\Admin\Presentation\Console\ResetAdminPasswordCommand:
        public: true

    App\Admin\Presentation\Console\DisableAdminUserCommand:
        public: true

    # Le UserProvider et le UserChecker sont récupérés via alias par le
    # security bundle en test intégration — pas besoin de public ici.

    # Login throttling : Symfony pose deux fenêtres (`_login_local_admin` et
    # `_login_global_admin`) sur le cache `cache.rate_limiter`, qui est
    # `FilesystemAdapter` par défaut. Ce cache persiste entre les runs PHPUnit
    # et sature les 5 tentatives autorisées → les tests qui doivent réussir se
    # font rejeter avec un renvoi vers /admin/login. On force donc les deux
    # storages à `InMemoryStorage` : chaque boot de kernel repart d'un compteur
    # neuf, sans changer le comportement documenté (throttling toujours actif
    # dans les tests qui tapent >5 échecs consécutifs dans un même kernel).
    limiter.storage._login_local_admin:
        class: Symfony\Component\RateLimiter\Storage\InMemoryStorage
        public: true

    limiter.storage._login_global_admin:
        class: Symfony\Component\RateLimiter\Storage\InMemoryStorage
        public: true

    # Horloge testable : chaque test peut geler l'instant en surchargeant
    # ce service (via `getContainer()->set(...)`).
    Symfony\Component\Clock\NativeClock:
        public: true
