; Devzair Phase 9A — limites PHP pour le pipeline média éditorial.
;
; Objectif : accepter des téléversements jusqu'à 8 MiB (policy centralisée
; côté application) sans butter sur les défauts PHP (upload_max_filesize=2M,
; post_max_size=8M). Marges volontairement modestes : la limite dure
; applicative reste 8 MiB, PHP tolère 12 MiB pour renvoyer proprement une
; erreur métier plutôt qu'un 413 nginx/serveur avant même d'atteindre le
; handler. Les défauts PHP sont conservés partout où ces valeurs ne
; s'appliquent pas (le fichier n'est chargé que par l'image API Devzair).
;
; Voir docs/05-SECURITY-PRIVACY.md §14.8 et la MediaUploadPolicy applicative
; (apps/api/src/EditorialMedia/Domain/Policy/MediaUploadPolicy.php).

upload_max_filesize = 12M
post_max_size = 16M
memory_limit = 256M
max_file_uploads = 1
