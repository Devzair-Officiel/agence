; Devzair Phase 12 — OPcache production.
;
; validate_timestamps=0 : PHP ne vérifie plus si les fichiers ont changé
; sur disque. Gain CPU significatif. Valide parce qu'en production le code
; est cuit dans l'image Docker — un changement de code = rebuild + redéploiement.
;
; Synchronisé avec apps/api/docker/php/editorial-media.ini pour l'upload.

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.fast_shutdown=1
opcache.jit_buffer_size=64M
opcache.jit=tracing
